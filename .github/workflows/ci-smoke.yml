# End-to-end smoke test: the CDC pipeline really runs on a GitHub-hosted
# runner, with Ollama replaced by the deterministic stub in bench/ci/.
#
# It proves the plumbing (Postgres -> Debezium -> Kafka -> agent -> Qdrant),
# never the answer quality: the tests that need a real model (T0.5, T0.9,
# T0.10) belong to ci-nightly.
#
# Defined in docs/piano_ricovero.md section 5.
---
name: ci-smoke

on:
  push:
    branches: [develop, "release/**"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Compose profiles arrive in v0.0.3; until then the CI subset is named
      # service by service, which keeps Elasticsearch, OpenMetadata, Flink and
      # Trino off a 16 GB runner without touching the compose files.
      - name: Start the CI subset of the stack (mock Ollama)
        run: |
          docker compose \
            -f docker-compose-northstream-ai.yml \
            -f docker-compose.addon.yml \
            -f bench/ci/mock-ollama.yml \
            up -d --build \
            kafka postgres debezium-connect qdrant ollama stream-agent data-generator

      - name: Wait for Kafka Connect
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8083/connectors >/dev/null; then
              echo "Kafka Connect is up"
              exit 0
            fi
            sleep 5
          done
          echo "Kafka Connect did not come up in time" >&2
          exit 1

      - name: Register the Debezium CDC connector
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /tmp/register.out -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data @connectors/postgres-source-connector.json \
              http://localhost:8083/connectors)
            # 409 means it is already registered, which is just as good.
            if [ "$status" = "201" ] || [ "$status" = "409" ]; then
              echo "connector registered (HTTP $status)"
              break
            fi
            echo "attempt $attempt: HTTP $status"
            cat /tmp/register.out
            sleep 10
          done
          curl -s http://localhost:8083/connectors/northstream-postgres-connector/status

      # The agent subscribes to Kafka by topic pattern at startup, and
      # kafka-python only refreshes cluster metadata every 5 minutes by
      # default. Topics created later — which is the case here, since the CDC
      # connector is registered after the stack is up, exactly as the demo
      # instructions say — are therefore not visible to it immediately. Wait
      # for the first event to actually land in the agent before asserting
      # anything about freshness, and record how long that took.
      - name: Wait for the agent to observe its first event
        run: |
          start=$(date +%s)
          for _ in $(seq 1 72); do
            count=$(curl -sf http://localhost:8500/events?limit=1 | tr -d '[:space:]' | wc -c)
            if [ "${count:-0}" -gt 2 ]; then
              echo "agent saw its first event after $(( $(date +%s) - start ))s"
              exit 0
            fi
            sleep 5
          done
          echo "the agent saw no event in $(( $(date +%s) - start ))s" >&2
          docker logs --tail 50 northstream-stream-agent >&2 || true
          exit 1

      - name: Run the T0 CI suite
        env:
          # RUN_ID is left to the harness so it follows the convention of
          # docs/piano_ricovero.md section 3: <YYYYMMDD-HHMM>-<env>-<sha>.
          # Tighter budgets than the workstation defaults, so the whole suite
          # stays well inside the job timeout even when every wait is spent.
          NS_STACK_TIMEOUT: "240"
          NS_INDEX_TIMEOUT: "180"
          NS_TEST_TIMEOUT: "300"
          NS_AGENT_TIMEOUT: "120"
        run: bench/t0/run.sh --suite ci --env ci-smoke --report results/ci-smoke

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p results/ci-smoke/logs
          for service in kafka postgres debezium-connect qdrant ollama stream-agent data-generator; do
            docker compose \
              -f docker-compose-northstream-ai.yml \
              -f docker-compose.addon.yml \
              -f bench/ci/mock-ollama.yml \
              logs --no-color --tail 400 "$service" \
              >"results/ci-smoke/logs/${service}.log" 2>&1 || true
          done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-smoke-report
          path: results/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker-compose-northstream-ai.yml \
            -f docker-compose.addon.yml \
            -f bench/ci/mock-ollama.yml \
            down -v
