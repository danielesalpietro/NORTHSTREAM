name: wap-northstream-lab
 
services:
  # ------------------------------------------------------------
  # DATA IN MOTION / CONFLUENT-LIKE LAYER
  # ------------------------------------------------------------
  kafka:
    image: bitnamilegacy/kafka:3.7.1
    container_name: northstream-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
 
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: northstream-kafka-ui
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: northstream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
      debezium-connect:
        condition: service_started
 
  schema-registry:
    image: apicurio/apicurio-registry:3.0.9
    container_name: northstream-schema-registry
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
 
  # ------------------------------------------------------------
  # OPERATIONAL SOURCE + CDC / INTEGRATION LAYER
  # ------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: northstream-source-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: sales
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d sales"]
      interval: 10s
      timeout: 5s
      retries: 10
 
  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: northstream-debezium-connect
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: northstream-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
 
  # ------------------------------------------------------------
  # STREAM PROCESSING LAYER
  # ------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.19.1-scala_2.12
    container_name: northstream-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
 
  flink-taskmanager:
    image: flink:1.19.1-scala_2.12
    container_name: northstream-flink-taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 4
 
  # ------------------------------------------------------------
  # LAKEHOUSE FOUNDATION LAYER
  # ------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: northstream-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Password123!
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
 
  create-minio-bucket:
    image: minio/mc:latest
    container_name: northstream-create-minio-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin Password123!;
      mc mb -p local/lakehouse || true;
      mc mb -p local/raw-events || true;
      mc mb -p local/curated-data || true;
      exit 0;
      "
 
  trino:
    image: trinodb/trino:463
    container_name: northstream-trino
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - minio
 
  # ------------------------------------------------------------
  # DATA INTELLIGENCE / GOVERNANCE LAYER
  # ------------------------------------------------------------
  openmetadata-db:
    image: postgres:16
    container_name: northstream-openmetadata-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmetadata
      POSTGRES_PASSWORD: openmetadata
      POSTGRES_DB: openmetadata_db
    volumes:
      - openmetadata_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmetadata -d openmetadata_db"]
      interval: 10s
      timeout: 5s
      retries: 10
 
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: northstream-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
 
  openmetadata:
    image: openmetadata/server:1.7.0
    container_name: northstream-openmetadata
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: openmetadata-db
      DB_PORT: 5432
      OM_DATABASE: openmetadata_db
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: '[admin]'
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '[all]'
      AUTHORIZER_INGESTION_PRINCIPALS: '[ingestion-bot]'
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      AUTHENTICATION_PROVIDER: basic
      OM_JWT_ISSUER: open-metadata.org
      OM_JWT_KEY_ID: northstream-local
      OM_JWT_ENABLE_KEY_ID: "true"
    depends_on:
      openmetadata-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
 
 
  # ------------------------------------------------------------
  # AI / CHAT WITH DATA LAYER
  # ------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: northstream-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
 
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: northstream-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_NAME: NORTHSTREAM Chat
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
 
volumes:
  kafka_data:
  postgres_data:
  minio_data:
  openmetadata_db_data:
  elasticsearch_data:
  ollama_data:
  open_webui_data: